name: Integración Continua C++

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build g++ doxygen

      - name: Configurar
        run: meson setup build

      - name: Compilar
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Documentación
        run: meson compile -C build docs